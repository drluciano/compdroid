[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compdroid"
version = "0.0.1"
description = "Builds a native Android APK from a Switch game dump you own (native ARM64 execution, no emulation)."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
compdroid = "compdroid.cli:main"

[project.gui-scripts]
compdroid-gui = "compdroid.gui:main"

[tool.setuptools.packages.find]
include = ["compdroid*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
